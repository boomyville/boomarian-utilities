name: Build Pixel Snapper GUI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Pixel Snapper source
        uses: actions/checkout@v4
        with:
          repository: Hugo-Dz/spritefusion-pixel-snapper
          ref: main
          path: pixel-snapper

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUI
        shell: bash
        working-directory: pixel-snapper
        run: bash ../scripts/build-pixel-snapper-gui.sh

      - name: Package executable
        shell: pwsh
        run: |
          Compress-Archive -Path "pixel-snapper/dist/Pixel-Snapper.exe" `
            -DestinationPath "pixel-snapper/dist/Pixel-Snapper-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Snapper-Windows-x64
          path: pixel-snapper/dist/Pixel-Snapper-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pixel-snapper/dist/Pixel-Snapper-Windows-x64.zip
          generate_release_notes: true
