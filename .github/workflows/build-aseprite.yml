name: Build Aseprite (Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Aseprite source
        uses: actions/checkout@v7
        with:
          repository: aseprite/aseprite
          ref: main
          path: aseprite
          submodules: recursive
          fetch-depth: 0

      - name: Set up Visual Studio C++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Build Aseprite
        shell: bash
        working-directory: aseprite
        run: bash ../scripts/build-aseprite.sh

      - name: Package Windows build
        shell: pwsh
        run: |
          if (!(Test-Path "aseprite/build/bin/aseprite.exe")) {
            throw "Aseprite executable was not produced."
          }

          Compress-Archive `
            -Path "aseprite/build/bin/*" `
            -DestinationPath "aseprite/dist/Aseprite-Windows-x64.zip" `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: aseprite/dist/Aseprite-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aseprite/dist/Aseprite-Windows-x64.zip
          generate_release_notes: true
